name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.8.1

jobs:
  build:
    name: forge build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      - run: forge build

  fmt:
    name: forge fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge fmt --check

  lint:
    name: forge lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      # Scoped to src + script and set to FAIL on a warning. Bare `forge lint` exits 0 whatever it
      # finds, so this job reported without enforcing - on every release, not just 1.8.x. The trade is
      # explicit: scoping also stops it REPORTING on test/, which is ~204 warnings it used to print
      # and nobody read. Those rules are fixture style, and gating on them would mean suppressing
      # hundreds of no-risk sites. Run `forge lint` unscoped to see them.
      #
      # This gate is not a substitute for compilation: `forge lint` is silent on a file it cannot
      # parse, and exits 0. `forge build --deny warnings` above is what catches that.
      - run: forge lint src script --deny warnings

  solhint:
    name: solhint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:sol

  docs:
    name: docs gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The primitives catalog is generated from the script/ tree; fail if it is stale, a primitive
      # lacks a @notice, or an entry names a deleted script.
      - name: primitives catalog freshness and coverage
        run: npm run docs:catalog:check
      # Links and anchors resolve across all docs; authored docs carry no em-dashes.
      - name: docs links, anchors, and prose
        run: npm run docs:check

  # Fork tests default to public Sepolia RPC endpoints (with fallback), so no secret is required. Set
  # an ETHEREUM_SEPOLIA_RPC_URL repository secret to override with a private endpoint; unset, it
  # arrives as an empty string and BaseForkTest falls through to the public list, which is the
  # behaviour with no secret configured at all. Note secrets are not exposed to runs triggered by a
  # pull request from a fork, so those keep the public endpoints either way.
  test:
    name: forge test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      - run: forge test -vv
        env:
          ETHEREUM_SEPOLIA_RPC_URL: ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}
      # The suite must strand NOTHING in the stores, whatever the filename - tracked, untracked, or
      # gitignored. `batches/` is in scope and is checked WHOLESALE: it is an accumulate-and-keep
      # store of the operator's local run artifacts, and the suite emits batches under operator-shaped
      # action names (`mint`, `accept-ownership`, ...) that no name pattern can tell apart from a real
      # one, so the check is by inventory rather than by name. Note this is an ABSOLUTE-EMPTINESS
      # check, not an inventory DIFF: it asserts these paths are clean, which holds in CI because a
      # checkout starts that way (`batches/` holding only the committed example). On a developer
      # machine with real operator batches or live project state it will flag them, so it is not
      # runnable as-is there - compare against your own pre-run inventory instead.
      # The tests both prefix their batches `zz-scratch-` and sweep them (test/utils/BatchScratch.sol),
      # so a missed sweep is caught whatever it was called.
      #
      # `if: always()` because the residue this most needs to catch is the residue a FAILING run
      # leaves: the sweeps are ordered before the asserts but not before a revert, so a revert inside
      # a step between emit and sweep strands the batch. Under the default `success()` that is exactly
      # the case the gate would stay silent about. It still exits non-zero on residue, so it fails the
      # job on its own - `always()` does not make it advisory.
      - name: no test residue (any filename)
        if: always()
        run: |
          residue="$(git status --porcelain --ignored -- config/chains project history batches)"
          if [ -n "$residue" ]; then
            echo "$residue"
            echo "test residue: a forge test run must leave the store inventory unchanged"
            exit 1
          fi

  # The offline partition of the chain-config tooling suite: guards, make-arg preflights, the
  # local-fixture-server sync, the canonical-format checks, and the committed-tree gates (git
  # ls-files, the gitignore contract, the secret-shaped-value lint, the config-purity grep). It
  # reaches no live CCIP API, so it is deterministic and blocks PRs. The live partition (selector
  # and drift resolution against the real API) runs on a schedule in config-drift.yml.
  tooling-offline:
    name: config-tooling (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      - name: test-tooling.sh (offline partition)
        run: TOOLING_PARTITION=offline bash script/config/test-tooling.sh
      # Every committed config/chains + project file must already be in its exact canonical form
      # (config: jq -S + trailing newline; project: jq -S, no trailing newline). A hand edit in the
      # wrong form otherwise surfaces later as a phantom diff on the next sync/deploy.
      # Also `always()`: this is a tree-state check, and a test-tooling.sh run that aborts mid-case is
      # precisely when a fixture can be left behind in a non-canonical form. Exits non-zero via
      # `git diff --exit-code`, so it still fails the job.
      - name: canonical form (fmt-config is a no-op on a clean tree)
        if: always()
        run: |
          make fmt-config
          git diff --exit-code -- config/chains project
